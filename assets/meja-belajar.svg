<svg viewBox="0 0 400 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ilustrasi meja belajar dengan buku dan lampu">
  <rect x="0" y="200" width="400" height="10" fill="#D8CFB8"/>
  <rect x="40" y="150" width="320" height="16" rx="4" fill="#3B4868"/>
  <rect x="55" y="166" width="14" height="34" fill="#1E2A4A"/>
  <rect x="330" y="166" width="14" height="34" fill="#1E2A4A"/>

  <!-- books stack -->
  <rect x="80" y="118" width="90" height="16" rx="2" fill="#C0392B"/>
  <rect x="85" y="102" width="80" height="16" rx="2" fill="#F2C94C"/>
  <rect x="90" y="86" width="70" height="16" rx="2" fill="#2F6B4F"/>

  <!-- lamp -->
  <line x1="270" y1="150" x2="270" y2="95" stroke="#1E2A4A" stroke-width="4"/>
  <polygon points="240,60 300,60 288,95 252,95" fill="#F2C94C" stroke="#1E2A4A" stroke-width="3"/>
  <circle cx="270" cy="150" r="6" fill="#1E2A4A"/>

  <!-- open notebook -->
  <polygon points="150,150 200,140 250,150 200,158" fill="#FFFDF8" stroke="#1E2A4A" stroke-width="2.5"/>
  <line x1="200" y1="140" x2="200" y2="158" stroke="#1E2A4A" stroke-width="2"/>
  <line x1="160" y1="147" x2="192" y2="141" stroke="#D8CFB8" stroke-width="1.5"/>
  <line x1="208" y1="141" x2="240" y2="147" stroke="#D8CFB8" stroke-width="1.5"/>
</svg>
